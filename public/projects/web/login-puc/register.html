<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Demonstração local de cadastro do projeto Login PUC.">

    <title>Cadastro | PUC Minas</title>

    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <main class="login-container">
        <section class="login-image" aria-hidden="true"></section>

        <section class="login-content">
            <div class="login-box">
                <img src="./images/logo-puc.png" alt="Logo PUC Minas" class="logo">

                <h1>
                    Crie sua conta
                </h1>

                <p class="subtitle">
                    Preencha os dados abaixo para se cadastrar
                </p>

                <p class="demo-notice">
                    Demonstração local. Não utilize uma senha real.
                </p>

                <form id="register-form">
                    <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

                    <div class="input-group">
                        <label for="name">
                            Nome
                        </label>

                        <input type="text" id="name" name="name" placeholder="Digite seu nome" autocomplete="name"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="username">
                            Usuário
                        </label>

                        <input type="text" id="username" name="username" placeholder="Digite seu usuário"
                            autocomplete="username" required>
                    </div>

                    <div class="input-group">
                        <label for="email">
                            E-mail
                        </label>

                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="password">
                            Senha
                        </label>

                        <input type="password" id="password" name="password" placeholder="Digite sua senha"
                            autocomplete="new-password" minlength="4" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">
                            Confirmar senha
                        </label>

                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Digite sua senha novamente" autocomplete="new-password" minlength="4" required>
                    </div>

                    <button type="submit">
                        Cadastrar
                    </button>
                </form>

                <p class="register">
                    Já possui uma conta?

                    <a href="./index.html">
                        Entrar
                    </a>
                </p>
            </div>
        </section>
    </main>

    <script src="./js/app.js"></script>
</body>

</html>
